# ==============================================================================
# Enterprise Azure DevOps Orchestrator Pipeline (CI + CD with Environment Gate)
# ==============================================================================
# Architecture:
#   - PR Trigger: Automatically runs Security & Quality scans + Plan (Apply is blocked)
#   - Manual Run / Merge Trigger: Allows selecting target environment via dropdown
#   - Tool Toggles: Runtime selection of scanning tools (Gitleaks, TFLint, Checkov, Trivy, Infracost)
#   - Manual Validation: Reviewer notification after Plan + Approval Gate before Apply
#   - Reusability: Built 100% on modular templates in pipelines/templates/
# ==============================================================================

name: $(Date:yyyyMMdd)$(Rev:.r)-tf-${{ parameters.environment }}

# ------------------------------------------------------------------------------
# Branch Triggers & PR Triggers
# ------------------------------------------------------------------------------
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - environments/**
      - modules/**
      - pipelines/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - environments/**
      - modules/**
      - pipelines/**

# ------------------------------------------------------------------------------
# Runtime Parameters (Interactive Dropdowns & Toggles on Run Pipeline)
# ------------------------------------------------------------------------------
parameters:
  - name: environment
    displayName: '🎯 Target Deployment Environment'
    type: string
    default: 'dev'
    values:
      - dev
      - qa
      - prod

  - name: deploymentAction
    displayName: '⚙️ Pipeline Execution Mode'
    type: string
    default: 'ValidatePlanAndApply'
    values:
      - ValidatePlanAndApply
      - PlanOnly

  # ----------------------------------------------------------------------------
  # Granular Security & Compliance Scanning Options (User Selectable)
  # ----------------------------------------------------------------------------
  - name: enableGitleaks
    displayName: '🔑 Run Gitleaks (Secret & Token Leak Scanner)'
    type: boolean
    default: true

  - name: enableTflint
    displayName: '🧹 Run TFLint (Terraform Syntax & Provider Linter)'
    type: boolean
    default: true

  - name: enableCheckov
    displayName: '🛡️ Run Checkov (CIS Benchmarks & Security Compliance)'
    type: boolean
    default: true

  - name: enableTrivy
    displayName: '🔎 Run Trivy (IaC Misconfiguration Scanner)'
    type: boolean
    default: true

  - name: enableInfracost
    displayName: '💰 Run Infracost (Monthly Cloud Cost Estimation)'
    type: boolean
    default: true

  - name: approverEmails
    displayName: '📧 Approver Email(s) for Manual Validation'
    type: string
    default: 'upsy0910@gmail.com'

  - name: terraformVersion
    displayName: '🔧 Terraform Version'
    type: string
    default: '1.9.5'

# ------------------------------------------------------------------------------
# Variables (Dynamic Resolution based on Selected Environment)
# ------------------------------------------------------------------------------
variables:
  - name: workingDirectory
    value: '$(System.DefaultWorkingDirectory)/environments/${{ parameters.environment }}'
  - name: azureServiceConnection
    value: 'sc-azure-terraform-${{ parameters.environment }}'
  - name: backendResourceGroup
    value: 'rg-enterprise-${{ parameters.environment }}-mgmt-eastus2'
  - name: backendStorageAccount
    value: 'stoneaimtfstatedev'
  - name: backendContainer
    value: 'tfstate'
  - name: backendKey
    value: '${{ parameters.environment }}.terraform.tfstate'
  - name: adoEnvironment
    value: 'azure-infrastructure-${{ parameters.environment }}'
  - name: vmImageName
    value: 'ubuntu-latest'

stages:
  # ============================================================================
  # Stage 1: Security SAST, Compliance & Quality Gate (100% Free Tools)
  # Tools: Gitleaks, TFLint, Trivy, Checkov, terraform fmt, terraform validate
  # ============================================================================
  - template: templates/stage-security-lint.yml
    parameters:
      stageName: 'SecurityAndQualityAudit'
      displayName: '🛡️ Security SAST, Lint & Compliance'
      workingDirectory: $(workingDirectory)
      terraformVersion: ${{ parameters.terraformVersion }}
      vmImageName: $(vmImageName)
      enableGitleaks: ${{ parameters.enableGitleaks }}
      enableTflint: ${{ parameters.enableTflint }}
      enableCheckov: ${{ parameters.enableCheckov }}
      enableTrivy: ${{ parameters.enableTrivy }}
      enableFmtCheck: true
      enableValidate: true

  # ============================================================================
  # Stage 2: Speculative Terraform Execution Plan & FinOps Cost Estimation
  # Tools: Terraform Plan, Infracost Cost Breakdown, Reviewer Notification
  # ============================================================================
  - template: templates/stage-terraform-plan.yml
    parameters:
      stageName: 'TerraformPlanAndCost'
      displayName: '📋 Execution Plan & Cost Check (${{ parameters.environment }})'
      dependsOn: ['SecurityAndQualityAudit']
      condition: succeeded()
      workingDirectory: $(workingDirectory)
      environment: ${{ parameters.environment }}
      azureServiceConnection: $(azureServiceConnection)
      backendResourceGroup: $(backendResourceGroup)
      backendStorageAccount: $(backendStorageAccount)
      backendContainer: $(backendContainer)
      backendKey: $(backendKey)
      terraformVersion: ${{ parameters.terraformVersion }}
      vmImageName: $(vmImageName)
      enableInfracost: ${{ parameters.enableInfracost }}

  # ============================================================================
  # Stage 3: Manual Approval Gate & Deployment (NEVER runs on PR)
  # Runs only when action is ValidatePlanAndApply, previous stages succeed, and not a PR
  # ============================================================================
  - template: templates/stage-terraform-apply.yml
    parameters:
      stageName: 'ManualApprovalAndApply'
      displayName: '🚀 Manual Approval & Apply (${{ parameters.environment }})'
      dependsOn: ['TerraformPlanAndCost']
      condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'), eq('${{ parameters.deploymentAction }}', 'ValidatePlanAndApply'))
      workingDirectory: $(workingDirectory)
      environment: ${{ parameters.environment }}
      adoEnvironment: $(adoEnvironment)
      azureServiceConnection: $(azureServiceConnection)
      backendResourceGroup: $(backendResourceGroup)
      backendStorageAccount: $(backendStorageAccount)
      backendContainer: $(backendContainer)
      backendKey: $(backendKey)
      requireManualValidation: true
      notifyUsers: ${{ parameters.approverEmails }}
      terraformVersion: ${{ parameters.terraformVersion }}
      vmImageName: $(vmImageName)
